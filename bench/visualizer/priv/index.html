<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Solace Bench Visualizer</title>
  <style>
    :root{color-scheme:dark;--bg:#11131a;--panel:#1a1e28;--line:#303746;--muted:#929bad;--ink:#edf1f7;--accent:#76a9fa;--good:#57c78b;--bad:#ef7181}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--ink)}header{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}h1{font-size:20px;margin:0 auto 0 0}button,input,select{font:inherit;color:inherit;background:#242a37;border:1px solid var(--line);border-radius:7px;padding:7px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}main{padding:18px 24px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:14px 0}.group{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.group-head{display:flex;gap:8px}.group-head input{font-weight:650;min-width:0;flex:1}.paths{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;min-height:24px}.path{display:flex;gap:5px;align-items:center;background:#242a37;border-radius:999px;padding:4px 8px;max-width:100%}.path span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.path button,.icon{padding:1px 5px;border:0;background:transparent}.status{color:var(--muted);margin:10px 0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:52vh}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{position:sticky;top:0;background:#202532}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#252d3b}.pass{color:var(--good)}.fail{color:var(--bad)}.chart{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.chart-head{display:flex;align-items:center;gap:10px}.chart-head h2{font-size:16px;margin:0 auto 0 0}.bars{margin-top:12px;display:grid;gap:10px}.bar-label{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}.track{height:18px;background:#252a36;border-radius:4px;overflow:hidden}.fill{height:100%;min-width:2px;background:linear-gradient(90deg,#547fd1,var(--accent));border-radius:4px}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#0009;padding:5vw}.dialog{width:min(680px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:10px}.dialog-head{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line)}.dialog-head strong{margin-right:auto}.entries{padding:8px;max-height:60vh;overflow:auto}.entry{display:flex;align-items:center;gap:8px;padding:7px;border-radius:6px}.entry:hover{background:#242a37}.entry span{margin-right:auto}.empty{color:var(--muted);padding:18px;text-align:center}@media(max-width:700px){header,main{padding:12px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">import { main } from "/app.js"; main();</script>
</body>
</html>
