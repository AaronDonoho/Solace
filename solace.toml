# Solace root: the projects in this folder, shown on one board. Each has its own solace.toml.
projects = ["bench/visualizer", "bench/visualizer/frontend", "solace-cli/board", "solace-cli/migration", "solace-cli/frontend", "solace-cli/contracts", "solace-cli/components", "solace-cli/strategy", "solace-cli/settings", "solace-cli"]
# Solace project settings. Protected: agents may read this file.
# Text files up to this many bytes are watched; file writes are limited to it.
watch_limit = 262144
# Files Solace doesn't watch or search (agents can still read and write them).
unwatched = []

[validators]
# Optional checks, for example:
# "docs/**/*.json" = ["python3", "-m", "json.tool", "{file}"]

[commands]
# Optional commands agents may run, for example:
# app = { run = ["gleam", "run", "--"], args = true }
# Remakes the pages' bundle, solace-cli/frontend/priv/app.js, after a change to any page project; the frontend's [build] step does the same.
bundle = { run = ["sh", "-c", "cd solace-cli/frontend && bun install --frozen-lockfile && gleam build && bun build src/main.mjs --outfile priv/app.js --minify --target browser"], allowed_in_reviews = true, timeout = 600 }
