# Solace root: the projects in this folder, shown on one board. Each has its own solace.toml.
projects = ["bench/visualizer", "bench/visualizer/frontend", "solace-cli/board", "solace-cli/migration", "solace-cli/frontend", "solace-cli/contracts", "solace-cli/components", "solace-cli/strategy", "solace-cli/settings"]
# Solace project settings. Protected: agents may read this file.
# Text files up to this many bytes are watched; file writes are limited to it.
watch_limit = 262144
# Files Solace doesn't watch or search (agents can still read and write them).
unwatched = []

[validators]
# Optional checks, for example:
# "docs/**/*.json" = ["python3", "-m", "json.tool", "{file}"]
# D-143: a write that misaligns the reference's columns is refused, naming the line.
"solace-cli/src/reference.txt" = ["python3", "solace-cli/tests/reference_layout.py", "{file}"]

[commands]
# Optional commands agents may run, for example:
# app = { run = ["gleam", "run", "--"], args = true }
rust-board-tests = { run = ["cargo", "test", "--manifest-path", "solace-cli/Cargo.toml", "board::"], allowed_in_reviews = true }
rust-lockdown-tests = { run = ["cargo", "test", "--manifest-path", "solace-cli/Cargo.toml", "lockdown::"], allowed_in_reviews = true }
# Every module's unit tests; an argument filters by test name (`tasks::`, `scope::`).
rust-unit = { run = ["env", "-u", "SOLACE_TASK", "-u", "SOLACE_RUN", "-u", "SOLACE_SESSION", "-u", "SOLACE_CONFIG", "-u", "SOLACE_BIN", "cargo", "test", "--manifest-path", "solace-cli/Cargo.toml", "--bins"], args = true, allowed_in_reviews = true }
# D-71: fixture instances run independently of the invoking agent's task context.
rust-acceptance = { run = ["env", "-u", "SOLACE_TASK", "-u", "SOLACE_RUN", "-u", "SOLACE_SESSION", "-u", "SOLACE_CONFIG", "-u", "SOLACE_BIN", "cargo", "test", "--manifest-path", "solace-cli/Cargo.toml", "--test", "acceptance"], allowed_in_reviews = true }
# Layout measurements and screenshots of a fixture instance, light and dark (D-71 isolation).
# An argument limits it to one page: board, strategy[-vision|-features|-roadmap|-tasks], settings, task.
layout_audit = { run = ["env", "-u", "SOLACE_TASK", "-u", "SOLACE_RUN", "-u", "SOLACE_SESSION", "-u", "SOLACE_CONFIG", "-u", "SOLACE_BIN", "python3", "solace-cli/tests/layout_audit.py"], args = true, allowed_in_reviews = true }
cargo-timings = { run = ["cargo", "build", "--release", "--timings", "--manifest-path", "solace-cli/Cargo.toml"], allowed_in_reviews = true }
# Cold build measurement in an isolated target dir (leaves the normal cache alone): clean, then build.
cargo-cold-clean = { run = ["cargo", "clean", "--manifest-path", "solace-cli/Cargo.toml", "--target-dir", "solace-cli/target/cold"] }
cargo-cold-timings = { run = ["cargo", "build", "--release", "--locked", "--timings", "--manifest-path", "solace-cli/Cargo.toml", "--target-dir", "solace-cli/target/cold"] }
cargo-cold-timings-debug = { run = ["cargo", "build", "--locked", "--timings", "--manifest-path", "solace-cli/Cargo.toml", "--target-dir", "solace-cli/target/cold"] }
