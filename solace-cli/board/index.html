<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solace tasks</title>
<style>
body{font:16px system-ui,sans-serif;margin:24px;color:#20252b;background:#fafafa}button,input,textarea,select{font:inherit;padding:8px;margin:4px;border:1px solid #aab0b8;border-radius:4px}button{cursor:pointer;background:white}button:hover{background:#e9f1ff}button:focus-visible{outline:3px solid #286ac7}label{display:block}textarea{display:block;width:min(95%,700px);min-height:70px}input{width:min(80%,600px)}.board{display:flex;gap:12px;overflow-x:auto;margin:24px 0}.column{min-width:190px;flex:1;background:#edf0f4;padding:12px;border-radius:6px}.column h2{font-size:17px}.card{display:block;width:100%;text-align:left}.detail,.editor{border:1px solid #ccd0d5;padding:16px;border-radius:6px}small{display:block;color:#56606b;overflow-wrap:anywhere}pre{white-space:pre-wrap;font:inherit}.actions{display:flex;flex-wrap:wrap;gap:6px}[role=alert]{color:#a00016}article{border-bottom:1px solid #ddd;padding:8px}li{white-space:pre-wrap;margin-bottom:8px}.attention{color:#9a3b00}.status{display:inline-block;font-size:13px;padding:1px 8px;border-radius:10px;background:#e3e7ec;margin:4px 0}.working::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#1f7a3a;margin-right:6px;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.working::before{animation:none}}.note,.run{border:1px solid #ddd;border-radius:6px;padding:8px 12px;margin:8px 0;background:white}header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}header small{display:inline}.md p,.md ul,.md ol{margin:6px 0}.md pre,.transcript pre{background:#f1f3f6;padding:8px;border-radius:4px;overflow:auto;white-space:pre-wrap;font:13px ui-monospace,monospace;max-height:320px}code{font:13px ui-monospace,monospace;background:#eef1f5;padding:1px 4px;border-radius:3px}.transcript{border-left:3px solid #ccd0d5;padding-left:10px;margin-top:8px}.entry{margin:6px 0}details.entry>summary{cursor:pointer;color:#56606b}.tool .icon{display:inline-block;width:1.2em}.tool.ok .icon{color:#1f7a3a}.tool.failed .icon{color:#a00016}.muted{color:#56606b}.note .delete{margin-left:auto;font-size:13px;padding:2px 8px}

@font-face{font-family:"Solace Drawing";src:url("/drawing.woff") format("woff");font-display:swap}
:root{--sheet:#f7f6f0;--paper:#fffefa;--ink:#172226;--soft:#46575a;--line:#94a7a5;--grid:#dce7e1;--revision:#a32628;--entry:#1f6f7a;--logic:#8a948c;--effect:#b8691b;--test:#6a5ba6;--file:#8c8470;--focus:#174f78}
body:has(.view-page){margin:0;background:var(--sheet);color:var(--ink)}
.view-page{font:15px/1.45 'Solace Drawing','Arial Narrow',sans-serif;min-height:100dvh;position:relative;background:var(--sheet);color:var(--ink)}
.view-page *{box-sizing:border-box;scrollbar-color:var(--line) var(--paper)}.view-page input{caret-color:var(--focus)}.view-page input::placeholder{color:var(--soft);opacity:1}.view-page a{text-underline-offset:3px}.view-page ::selection{background:#bfd5ce;color:var(--ink)}
.view-page button,.view-page input{font:inherit;border-radius:0;margin:0;color:var(--ink)}
.view-page button{background:var(--paper);border:1px solid var(--ink);padding:6px 12px}.view-page button:hover{background:#e7eeea}.view-page button:focus-visible,.view-page input:focus-visible,.view-node:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.view-page h1,.view-page h2,.view-page h3{line-height:1.2;letter-spacing:-.02em}.view-page h1{font-size:28px;margin:0}.view-page h2{font-size:19px;margin:0 0 10px}.view-page h3{font-size:15px;margin:24px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.view-page p{margin:8px 0}.view-top{height:100px;padding:12px 22px;display:flex;gap:30px;align-items:center;border-bottom:2px solid var(--ink);background:var(--paper);position:relative;z-index:3}.view-top>div:first-child{min-width:230px}.view-back{color:var(--focus);font-size:13px;text-underline-offset:3px}.view-search{flex:1;max-width:500px}.view-search label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}.view-search input{background:var(--paper);width:100%;max-width:none;padding:8px;border:1px solid var(--ink)}.view-search-results{position:absolute;z-index:8;left:min(282px,25vw);top:88px;width:min(500px,65vw);background:var(--paper);border:1px solid var(--ink);max-height:300px;overflow:auto}.view-search-results:empty{display:none}.view-search-results button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--grid)}
.view-page{height:100dvh;display:flex;flex-direction:column;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.view-top{flex:none}
.view-sheet{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:20px;padding:24px}
.view-sheet-head{display:flex;align-items:flex-start;gap:24px;flex:none}
.view-drawing{flex:1;min-height:0;min-width:0}
.view-diagram{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.view-diagram:active{cursor:grabbing}
.view-tools{display:flex;gap:4px;margin-left:auto;flex:none}
.view-tools button{min-width:36px}
.view-legend,.view-titleblock{background:var(--paper);border:1px solid var(--ink);padding:12px 16px}
.view-legend{flex:none;width:360px;max-width:100%}
.view-legend h2{font-size:14px;text-transform:uppercase;letter-spacing:.1em}
.view-legend-mobile{display:none}
.view-legend-kinds,.view-legend-lines{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:12px}
.view-legend-lines{margin-top:10px}
.view-legend-kind,.view-legend-lines span{display:inline-flex;align-items:center;gap:6px}
.view-swatch{margin:0;width:15px;height:17px;border:1px solid var(--ink);background:var(--paper);position:relative}
.view-swatch:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--kind)}
.view-swatch.entry{--kind:var(--entry)}.view-swatch.logic{--kind:var(--logic)}.view-swatch.effect{--kind:var(--effect)}.view-swatch.test{--kind:var(--test)}.view-swatch.file{--kind:var(--file)}
.view-legend-lines svg{width:32px;height:18px;flex:none}
.view-revision-sample{fill:none;stroke:var(--revision);stroke-width:1.4}
.view-drawing-note{max-width:48ch;font-size:13px;line-height:1.5;color:var(--soft);margin:0!important}
.view-drawing-note:empty{display:none}
.view-titleblock{flex:none;align-self:flex-end;margin:0 24px 20px;width:300px;border-top:3px solid var(--ink);overflow-wrap:anywhere}
.view-titleblock p:first-child{font-weight:700;letter-spacing:.05em}
.view-titleblock p{font-size:12px;margin:3px 0}
.view-titleblock p:empty{display:none}
.view-wire{fill:none;stroke:var(--ink);stroke-width:1.6}
.view-arrow{fill:none;stroke:var(--ink);stroke-width:1.4}
.view-node{cursor:pointer;color:var(--ink)}
.view-box{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}
.view-node.entry .view-tab{fill:var(--entry)}.view-node.logic .view-tab{fill:var(--logic)}.view-node.effect .view-tab{fill:var(--effect)}.view-node.test .view-tab{fill:var(--test)}.view-node.file .view-tab{fill:var(--file)}.view-face .view-summary.none{color:var(--soft);font-style:italic}
.view-node.removed .view-box{stroke-dasharray:12 6;fill:var(--paper)}
.view-node.changed .view-box{stroke:var(--revision);stroke-width:1.8}
.view-cloud{display:none;fill:none;stroke:var(--revision);stroke-width:1.3}
.view-node.changed:not(.removed) .view-cloud{display:block}
.view-node.changed .view-badge,.view-node.removed .view-badge{fill:var(--revision)}
.view-node text{fill:var(--ink);font-family:'Solace Drawing','Arial Narrow',sans-serif}
.view-kind{font-size:9px;letter-spacing:1.1px}
.view-face{font-family:'Solace Drawing','Arial Narrow',sans-serif;line-height:1.3;pointer-events:none}
.view-face .view-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 4px}
.view-face .view-summary{font-size:11px;line-height:15px;height:30px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;margin:0 0 5px}
.view-face .view-signature{font-size:10px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.view-badge{font-size:8px;font-weight:700}
.view-panel{position:absolute;z-index:5;top:100px;right:0;width:min(410px,100%);height:calc(100dvh - 100px);overflow:auto;background:var(--paper);border-left:2px solid var(--ink);padding:24px;box-shadow:-9px 8px 24px #17222626}.view-panel-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.view-panel-head h2{overflow-wrap:anywhere}.view-detail-kind{text-transform:uppercase;letter-spacing:.1em;color:var(--soft);font-size:12px}.view-code,.view-source{font:12px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;white-space:pre-wrap;border-top:1px solid var(--line);padding-top:8px}.view-row{display:block;width:100%;text-align:left;margin:4px 0!important;overflow-wrap:anywhere}.view-review-summary{font-weight:700;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:12px 0}.view-review-test,.view-file{border-bottom:1px solid var(--line);padding:8px 0}.view-review-test p{overflow-wrap:anywhere}.view-error{position:absolute}.view-error:not(:empty){position:absolute;left:20px;bottom:20px;background:var(--paper);border:2px solid var(--revision);padding:12px;color:var(--revision);z-index:9}
@media(min-width:700px){
.view-page.has-panel .view-sheet-head{padding-right:410px;flex-wrap:wrap}
.view-page.has-panel .view-titleblock{margin-right:434px;width:min(300px,calc(100% - 458px))}
}
@media(max-width:699px){
.view-page{height:auto;min-height:100dvh}
.view-top{height:138px;min-height:138px;flex-wrap:wrap;gap:8px 14px;padding:10px 14px}
.view-top>div:first-child{min-width:0;flex:1}.view-top h1{font-size:22px}
.view-search{order:3;flex-basis:100%;max-width:none}.view-search-results{left:14px;top:130px;width:calc(100% - 28px)}
.view-sheet{flex:none;height:calc(100dvh - 138px);min-height:360px;padding:14px;gap:14px}
.view-sheet-head{flex-wrap:wrap;gap:10px;align-items:start}
.view-legend{width:auto;padding:0;border:0;background:transparent}
.view-legend-desktop{display:none}.view-legend-mobile{display:block}
.view-legend-mobile summary{cursor:pointer;min-height:36px;padding:6px 10px;border:1px solid var(--ink);background:var(--paper)}
.view-legend-mobile summary:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.view-legend:has(details[open]){order:2;width:100%}
.view-legend-mobile .view-legend-content{padding:12px;background:var(--paper);border:1px solid var(--ink);border-top:0}
.view-drawing-note{order:3;flex-basis:100%;max-width:none;font-size:12px}
.view-tools{margin-left:auto}
.view-titleblock{position:static;width:calc(100% - 28px);margin:0 14px 14px;padding:12px}
.view-panel{top:138px;height:calc(100dvh - 138px);width:100%;padding:18px}
}
@media(prefers-reduced-motion:reduce){.view-page *{scroll-behavior:auto!important}}
</style></head><body><div id="app"></div><script type="module" src="/app.js"></script></body></html>
