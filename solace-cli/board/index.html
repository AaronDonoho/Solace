<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solace tasks</title>
<script>
// The saved choice, else the system's, before first paint so there is no flash.
try { document.documentElement.dataset.theme = localStorage.getItem('solace-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url("/fonts/sans-400.woff2") format("woff2");font-display:swap}
@font-face{font-family:"IBM Plex Sans";font-weight:700;src:url("/fonts/sans-700.woff2") format("woff2");font-display:swap}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url("/fonts/mono-400.woff2") format("woff2");font-display:swap}
html{background:#f7f6f0;color-scheme:light}
body{font:16px "IBM Plex Sans",system-ui,sans-serif;margin:0}
html[data-theme=dark]{background:#1f2136;color-scheme:dark}
/* Dark tokens for both pages; the light ones live with each page's styles. */
html[data-theme=dark] :is(solace-board){--sheet:#1f2136;--paper:#292c4c;--ink:#e8eaf8;--soft:#aab0d8;--line:#3b3f7a;--edge:#4a4fa3;--grid:#262944;--revision:#ff5a66;--entry:#1fd05a;--logic:#4d9bff;--effect:#ff8a1f;--test:#9b7dff;--file:#d6b35a;--area:#2ec4b6;--focus:#8fb4ff;--well:#181a2f;--hover:#353a68;--code:#181a2f;--add:#1d4630;--del:#54263a;--sel:#43489a;--frame:#353a6899;--ok-text:#6fd88a;--warn-text:#f0a860;--shadow:#00000066}
</style></head><body><solace-board></solace-board><script type="module" src="/app.js"></script></body></html>
