# Solace project settings. Protected: agents may read this file.
# Text files up to this many bytes are watched; file writes are limited to it.
watch_limit = 262144
# Files Solace doesn't watch or search (agents can still read and write them).
unwatched = []

[validators]
# Optional checks, for example:
# "docs/**/*.json" = ["python3", "-m", "json.tool", "{file}"]

[commands]
install = { run = ["bun", "install"] }
js_tests = { run = ["bun", "test", "test/api.test.mjs"], allowed_in_reviews = true }
bundle = { run = ["bun", "build", "src/main.mjs", "--outfile", "priv/app.js", "--minify", "--target", "browser"] }
# The board's release output, priv/app.js: compiled Gleam, then bundled. solace-cli/build.rs runs this.
build-release = { run = ["sh", "-c", "bun install --frozen-lockfile && gleam build && bun build src/main.mjs --outfile priv/app.js --minify --target browser"] }
