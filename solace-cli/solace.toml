# Solace project settings. Protected: agents may read this file.
# Text files up to this many bytes are watched; file writes are limited to it.
watch_limit = 262144
# Files Solace doesn't watch or search (agents can still read and write them).
unwatched = []

# Folders outside this project that a sandboxed cargo command may read, relative to it.
[sandbox]
read = ["../bench/pilot-large"]

[validators]
# D-143: a write that misaligns the reference's columns is refused, naming the line.
"src/reference.txt" = ["python3", "tests/reference_layout.py", "{file}"]

[commands]
rust-board-tests = { run = ["cargo", "test", "board::"], allowed_in_reviews = true }
rust-lockdown-tests = { run = ["cargo", "test", "lockdown::"], allowed_in_reviews = true }
# Every module's unit tests; an argument filters by test name (`tasks::`, `scope::`).
rust-unit = { run = ["env", "-u", "SOLACE_TASK", "-u", "SOLACE_RUN", "-u", "SOLACE_SESSION", "-u", "SOLACE_CONFIG", "-u", "SOLACE_BIN", "cargo", "test", "--bins"], args = true, allowed_in_reviews = true }
# D-71: fixture instances run independently of the invoking agent's task context.
# The integration test is ignored so `test` skips the Python suites in its no-network sandbox; this runs them outside it.
rust-acceptance = { run = ["env", "-u", "SOLACE_TASK", "-u", "SOLACE_RUN", "-u", "SOLACE_SESSION", "-u", "SOLACE_CONFIG", "-u", "SOLACE_BIN", "cargo", "test", "--test", "acceptance", "--", "--include-ignored"], allowed_in_reviews = true }
# Layout measurements and screenshots of a fixture instance, light and dark (D-71 isolation).
# An argument limits it to one page: board, strategy[-vision|-features|-roadmap|-tasks], settings, task.
layout_audit = { run = ["env", "-u", "SOLACE_TASK", "-u", "SOLACE_RUN", "-u", "SOLACE_SESSION", "-u", "SOLACE_CONFIG", "-u", "SOLACE_BIN", "python3", "tests/layout_audit.py"], args = true, allowed_in_reviews = true }
# The shared spacing tokens and the board's column labels, against the one place that sets them.
spacing_parity = { run = ["python3", "tests/spacing_parity.py"], allowed_in_reviews = true }
cargo-timings = { run = ["cargo", "build", "--release", "--timings"], allowed_in_reviews = true }
# Cold build measurement in an isolated target dir (leaves the normal cache alone): clean, then build.
cargo-cold-clean = { run = ["cargo", "clean", "--target-dir", "target/cold"] }
cargo-cold-timings = { run = ["cargo", "build", "--release", "--locked", "--timings", "--target-dir", "target/cold"] }
cargo-cold-timings-debug = { run = ["cargo", "build", "--locked", "--timings", "--target-dir", "target/cold"] }
# Check-time measurement for the Rust symbol store plan: JSON diagnostics; arguments are passed to `cargo check`, e.g. `--target-dir target/cold` after `cargo-cold-clean`.
cargo-check-json = { run = ["cargo", "check", "--all-targets", "--message-format=json"], args = true }
# rustfmt state of the crate.
cargo-fmt-check = { run = ["cargo", "fmt", "--check"] }
# Test-time measurement; `--no-run` separates compile time from run time (D-71 isolation).
cargo-test = { run = ["env", "-u", "SOLACE_TASK", "-u", "SOLACE_RUN", "-u", "SOLACE_SESSION", "-u", "SOLACE_CONFIG", "-u", "SOLACE_BIN", "cargo", "test"], args = true }

# Solace's own crate, built after the frontend bundle it embeds (build.rs).
[build]
after = ["solace-cli/frontend"]
steps = [{ name = "cargo", run = ["cargo", "build", "--release", "--locked"], timeout = 900 }]
