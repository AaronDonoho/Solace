sandbox_mode = "read-only"
approval_policy = "never"
web_search = "live"
tool_output_token_limit = 30000
mcp_optional_startup_grace_ms = 0
developer_instructions = "The tool is the MCP tool `solace`. If you have `exec`, call it from there as `await tools.mcp__solace__solace({command: \"inspect app.main --context\"})`; one `exec` script can make several solace calls, so read everything you need in one step. Otherwise call `mcp__solace__solace` directly, putting new code in `text` for submit commands."
[features]
shell_tool = false
unified_exec = false
apply_patch_freeform = false
multi_agent = false
apps = false
plugins = false
goals = false
image_generation = false
view_image = false
browser_use = false
computer_use = false
in_app_browser = false
hooks = false
memories = false
tool_suggest = false
[mcp_servers.solace]
command = "/bin/solace"
args = ["mcp", "--budget", "32000"]
env_vars = ["SOLACE_TASK", "SOLACE_RUN", "SOLACE_SESSION", "SOLACE_CONFIG"]
default_tools_approval_mode = "approve"
tool_timeout_sec = 3600
required = true
startup_timeout_sec = 60
