<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solace tasks</title>
<script>
// The saved choice, else the system's, before first paint so there is no flash.
try { document.documentElement.dataset.theme = localStorage.getItem('solace-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:400;src:url("/fonts/sans-400.woff2") format("woff2");font-display:swap}
@font-face{font-family:"IBM Plex Sans";font-weight:700;src:url("/fonts/sans-700.woff2") format("woff2");font-display:swap}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url("/fonts/mono-400.woff2") format("woff2");font-display:swap}
html{background:#f7f6f0;color-scheme:light;--sheet:#f7f6f0;--paper:#fffefa;--ink:#172226;--soft:#46575a;--line:#94a7a5;--edge:#172226;--hover:#e7eeea;--focus:#174f78;--code:#eef1ec}
body{font:16px system-ui,sans-serif;margin:0;color:var(--ink);background:var(--sheet)}
.menu{display:flex;gap:8px;align-items:center;box-sizing:border-box;height:56px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:26}
/* The contract page fills the window below the menu. */
solace-contracts{--contracts-height:calc(100dvh - 56px)}
/* A page you left stays in the document, hidden, so its state is there when you come back. */
#app [hidden]{display:none!important}
/* The Knowledgebase page (D-140): the guide, in the shell's light DOM, so it takes the shell's tokens. */
.knowledgebase{box-sizing:border-box;max-width:760px;margin:0 auto;padding:24px 16px 64px;font:16px/1.55 'IBM Plex Sans',system-ui,sans-serif;color:var(--ink)}
.knowledgebase h1{font-size:28px}.knowledgebase h2{font-size:21px;margin-top:36px;border-top:1px solid var(--line);padding-top:20px}.knowledgebase h3{font-size:17px}
.knowledgebase section{scroll-margin-top:64px}.knowledgebase .toc ul{columns:2;padding-left:20px}
.knowledgebase a{color:var(--focus)}
.knowledgebase code,.knowledgebase pre{font:14px 'IBM Plex Mono',ui-monospace,monospace;background:var(--code)}.knowledgebase code{padding:1px 4px}.knowledgebase pre{padding:12px;overflow-x:auto}
.knowledgebase table{border-collapse:collapse;width:100%;font-size:15px}.knowledgebase th,.knowledgebase td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.menu a{display:block;padding:8px 12px;border-radius:4px;color:inherit;text-decoration:none}
.menu a:hover{background:var(--hover)}
.menu a.current{background:var(--ink);color:var(--paper)}
.menu a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* A tab whose page needs attention flashes until it is shown; with reduced motion it stays lit. */
.menu a.attention{--flash:#f5c518;background:var(--flash);color:#172226;animation:attention 1.2s ease-in-out infinite alternate}
@keyframes attention{from{background:var(--flash);color:#172226}to{background:transparent;color:inherit}}
@media(prefers-reduced-motion:reduce){.menu a.attention{animation:none}}
@media(forced-colors:active){.menu a.attention{animation:none;outline:3px solid Highlight}}
.attention-note{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* Find in page (Ctrl+F): a bar below the menu, above the board's layers. */
.find{position:fixed;top:64px;right:16px;z-index:30;display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--paper);color:var(--ink);border:2px solid var(--edge);box-shadow:0 4px 14px #00000033}
.find[hidden]{display:none}
.find input{font:inherit;width:16em;padding:4px 6px;border:1px solid var(--line);background:var(--sheet);color:inherit}
.find-count{min-width:6em;font-size:14px;color:var(--soft)}
.find button{font:inherit;min-width:32px;min-height:32px;border:1px solid var(--line);background:var(--paper);color:inherit;cursor:pointer}
.find button:hover{background:var(--hover)}
.find :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Matches are boxes drawn over the text; clicks and drags pass through to the page. */
.find-marks{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.find-mark{position:fixed;box-sizing:border-box;background:#f5c51866;border-radius:2px}
.find-mark.current{background:#ff8a1f80;outline:2px solid var(--focus)}
@media(forced-colors:active){.find-mark{background:none;outline:2px solid Highlight}.find-mark.current{outline:3px solid Highlight}}
/* A task link to no task (D-98): a message at the bottom that goes by itself, above every page's layers. */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:40;display:grid;gap:8px;max-width:calc(100% - 32px)}
.toast{padding:10px 18px;background:var(--ink);color:var(--paper);border:2px solid var(--edge);box-shadow:0 4px 14px #00000033;font-weight:700}
html[data-theme=dark]{background:#1f2136;color-scheme:dark;--sheet:#1f2136;--paper:#292c4c;--ink:#e8eaf8;--soft:#aab0d8;--line:#3b3f7a;--edge:#4a4fa3;--hover:#353a68;--focus:#8fb4ff;--code:#181a2f}
/* Dark tokens for all pages; the light ones live with each page's styles. The Settings page sets the theme. */
html[data-theme=dark] :is(solace-board,solace-contracts,solace-migration,solace-strategy,solace-settings){--sheet:#1f2136;--paper:#292c4c;--ink:#e8eaf8;--soft:#aab0d8;--line:#3b3f7a;--edge:#4a4fa3;--grid:#262944;--revision:#ff5a66;--entry:#1fd05a;--logic:#4d9bff;--effect:#ff8a1f;--test:#9b7dff;--file:#d6b35a;--area:#2ec4b6;--focus:#8fb4ff;--well:#181a2f;--hover:#353a68;--code:#181a2f;--add:#1d4630;--del:#54263a;--sel:#43489a;--frame:#353a6899;--ok-text:#6fd88a;--warn-text:#f0a860;--shadow:#00000066}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
