# Solace project settings. Protected: agents may read this file.
# Text files up to this many bytes are watched; file writes are limited to it.
watch_limit = 262144
# Files Solace doesn't watch or search (agents can still read and write them).
unwatched = []

[validators]
# Optional checks, for example:
# "docs/**/*.json" = ["python3", "-m", "json.tool", "{file}"]

[commands]
install = { run = ["bun", "install"] }
bundle = { run = ["bun", "bundle.mjs"] }
# The frontend's release output, priv/app.js: compiled Gleam, then bundled, with priv/app.js.fingerprint. Its [build] step `release` runs this.
build-release = { run = ["bun", "bundle.mjs"] }
js_tests = { run = ["bun", "test", "test/shell.test.mjs", "test/setup_ffi.test.mjs", "test/bundle.test.mjs"], allowed_in_reviews = true }

[build]
outputs = ["priv/app.js"]
steps = [{ name = "release", command = "build-release", timeout = 600 }]
