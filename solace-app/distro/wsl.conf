# WSL settings for the Solace distro (D-224, WINDOWS.md).

[user]
default=solace

# Linux programs don't start Windows programs, and Solace can't pick up a
# Windows git.exe or claude.exe. The Windows app reaches in through wsl.exe,
# which these settings don't affect.
[interop]
enabled=false
appendWindowsPath=false

# Windows drives aren't mounted here. Projects live inside the distro.
[automount]
enabled=false
